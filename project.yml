name: HarnessMobile
options:
  bundleIdPrefix: com.llf
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  HarnessMobileCore:
    path: .
targets:
  HarnessMobile:
    type: application
    platform: iOS
    entitlements:
      path: HarnessMobile/HarnessMobile.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.llf.harnessmobile.share
    sources:
      - path: HarnessMobile
        excludes:
          # AI collaboration rules are source-adjacent documentation, not
          # application resources. Keeping them out of the target also avoids
          # colliding `AGENTS.md` bundle names when XcodeGen recurses.
          - App/AGENTS.md
          - Core/Agent/AGENTS.md
          - Core/Plugins/AGENTS.md
          - Resources/PluginHost/node_modules
      # Keep the marketplace transaction coordinator explicit while the
      # project is regenerated from this spec. This file is intentionally
      # outside the generated group layout used by older checkouts.
      - path: HarnessMobile/Core/Plugins/PluginInstallCoordinator.swift
      - path: HarnessMobile/Core/Plugins/ISHHost/ISHNativeClientSlotRegistry.swift
      - path: HarnessMobile/Core/Trace/SessionPersistence.swift
      # Ralph is part of the production tool catalog and must remain in the
      # application target when the project is regenerated.
      - path: HarnessMobile/Core/Tools/RalphTool.swift
      - path: Vendor/OpenMinisISH/Artifacts/alpine-rootfs.zip
        buildPhase: resources
      - path: Vendor/OpenMinisISH/Artifacts/RootfsPatch.bundle
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile
        PRODUCT_NAME: HarnessMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2SH3TUR2JL
        OTHER_LDFLAGS: $(inherited) -ObjC
    dependencies:
      - target: HarnessMobileLiveActivity
        embed: true
      - target: HarnessMobileShare
        embed: true
      - framework: Vendor/OpenMinisISH/Artifacts/HarnessISH.xcframework
        embed: false
      - sdk: HealthKit.framework
      - sdk: SystemConfiguration.framework
      - sdk: libsqlite3.tbd
      - sdk: libresolv.tbd
    info:
      path: HarnessMobile/Resources/Info.plist
      properties:
        CFBundleDisplayName: Harness Mobile
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: Only used when you deliberately take a photo and hand it to the local OCR tool.
        NSPhotoLibraryUsageDescription: Only reads the items you deliberately pick for local OCR analysis.
        NSPhotoLibraryAddUsageDescription: Only writes to your photo library when you approve saving a result from the photo tool.
        NSContactsUsageDescription: Only reads limited names, phone numbers and email addresses when you approve the contact search tool.
        NSLocationWhenInUseUsageDescription: Only fetches your location once when you approve the location tool; no background tracking.
        NSLocationAlwaysAndWhenInUseUsageDescription: Only after you explicitly enable background coarse-location keep-alive and allow Always location: uses roughly 3 km accuracy while a background task runs. Coordinates are never stored or shown.
        NSMotionUsageDescription: Only reads recent on-device motion activity estimates when you approve the motion tool.
        NSMicrophoneUsageDescription: Only accesses the microphone when you deliberately use voice input.
        NSSpeechRecognitionUsageDescription: Only performs speech recognition when you deliberately use speech-to-text.
        NSCalendarsUsageDescription: Only queries or changes events when you approve the calendar tool.
        NSCalendarsFullAccessUsageDescription: Only queries or changes events when you approve the calendar tool.
        NSRemindersUsageDescription: Only queries or changes reminders when you approve the reminders tool.
        NSRemindersFullAccessUsageDescription: Only queries or changes reminders when you approve the reminders tool.
        NSAppleMusicUsageDescription: Only accesses the on-device music library when you approve the media tool.
        NSBluetoothAlwaysUsageDescription: Only scans for or connects to nearby BLE devices when you approve the Bluetooth tool.
        NSBluetoothPeripheralUsageDescription: Only communicates with nearby BLE devices when you approve the Bluetooth tool.
        NSLocalNetworkUsageDescription: Only uses the local network for features that need to reach devices on the same LAN when you approve them.
        NSHealthShareUsageDescription: Only reads the health data you select when you call and approve an Apple Health tool; tool results are sent to the configured model service and kept in the on-device session.
        NSHealthUpdateUsageDescription: Only writes the health data you select when you call and approve an Apple Health write tool.
        NSHomeKitUsageDescription: This build has no HomeKit capability; once signing grants it, accessories are queried or controlled only when you approve.
        NFCReaderUsageDescription: Only starts a single system scan session when you deliberately approve the NFC tool.
        NSFaceIDUsageDescription: Used to verify the device owner before sensitive on-device operations.
        BGTaskSchedulerPermittedIdentifiers:
          - com.llf.harnessmobile.continued-processing.*
          - com.llf.harnessmobile.schedule-processing
        UIBackgroundModes:
          - audio
          - location
          - processing
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    preBuildScripts:
      - name: Device-only tool audit
        script: '"$SRCROOT/Scripts/audit-no-remote-execution.sh"'
        inputFiles:
          - $(SRCROOT)/Scripts/audit-no-remote-execution.sh
        inputFileLists:
          - $(SRCROOT)/Scripts/device-audit-inputs.xcfilelist
        basedOnDependencyAnalysis: false
  HarnessMobileShare:
    type: app-extension
    platform: iOS
    entitlements:
      path: HarnessMobileShare/HarnessMobileShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.llf.harnessmobile.share
    sources:
      - path: HarnessMobileShare
        excludes:
          - Info.plist
          - HarnessMobileShare.entitlements
      - path: HarnessMobile/Core/Storage/ShareHandoff.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.share
        PRODUCT_NAME: HarnessMobileShare
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2SH3TUR2JL
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: HarnessMobileShare/Info.plist
      properties:
        CFBundleDisplayName: Share to Harness
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 8
              NSExtensionActivationSupportsImageWithMaxCount: 8
              NSExtensionActivationSupportsMovieWithMaxCount: 8
              NSExtensionActivationSupportsFileWithMaxCount: 8
  HarnessMobileLiveActivity:
    type: app-extension
    platform: iOS
    entitlements:
      path: HarnessMobileLiveActivity/HarnessMobileLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.llf.harnessmobile.share
    sources:
      - path: HarnessMobileLiveActivity
        excludes:
          - Info.plist
          - HarnessMobileLiveActivity.entitlements
      - path: HarnessMobile/Core/Background/HarnessActivityAttributes.swift
      - path: HarnessMobile/Core/Storage/HarnessWidgetProjection.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.liveactivity
        PRODUCT_NAME: HarnessMobileLiveActivity
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2SH3TUR2JL
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: HarnessMobileLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Harness Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  HarnessMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HarnessMobileTests
        excludes:
          - AGENTS.md
    dependencies:
      - target: HarnessMobile
      - package: HarnessMobileCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.tests
        GENERATE_INFOPLIST_FILE: YES
  HarnessMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HarnessMobileUITests
    dependencies:
      - target: HarnessMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.llf.harnessmobile.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  HarnessMobile:
    build:
      targets:
        HarnessMobile: all
        HarnessMobileTests:
          - test
        HarnessMobileUITests:
          - test
    test:
      targets:
        - HarnessMobileTests
        - HarnessMobileUITests
